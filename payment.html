<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGX智能体 - 支付中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #1a1a2e; --accent: #c9a227; }
    body { font-family: 'Inter', 'Noto Serif SC', sans-serif; }
    .modal { display: none; }
    .modal.active { display: flex; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="./index.html" class="flex items-center gap-2">
        <img src="./assets/rgx-logo.png" alt="RGX" class="h-8">
        <span class="font-bold text-primary">RGX智能体</span>
      </a>
      <div class="text-sm text-muted">支付中心</div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8">

    <!-- 支付引导 -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
      <h1 class="serif text-2xl font-bold text-primary mb-2">购买课程</h1>
      <p class="text-muted mb-6">扫码支付后填写订单信息，管理员确认后自动解锁</p>

      <!-- 收款码 -->
      <div class="flex flex-col md:flex-row gap-6 items-center">
        <div class="text-center">
          <img src="./assets/payment_qr.png" alt="微信支付" class="w-48 h-48 rounded-xl border-2 border-gray-200">
          <p class="text-sm text-muted mt-2">微信扫码支付</p>
        </div>

        <div class="flex-1 w-full">
          <div class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">手机号码 <span class="text-red-500">*</span></label>
              <input type="tel" id="phone" placeholder="请输入手机号" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">微信昵称</label>
              <input type="text" id="wechat" placeholder="便于管理员联系（可选）" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">购买课程</label>
              <select id="course-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                <option value="">请选择课程</option>
                <option value="all">全部33门课程 - ¥399</option>
                <option value="single">单门课程 - ¥9.9</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">订单备注</label>
              <textarea id="note" placeholder="付款人姓名、课程名称等（可选）" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent" rows="2"></textarea>
            </div>
          </div>

          <button onclick="submitOrder()" class="mt-4 w-full bg-accent text-primary font-semibold py-3 rounded-lg hover:bg-accent/90 transition">
            提交订单
          </button>
        </div>
      </div>
    </div>

    <!-- 价格说明 -->
    <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-6">
      <h3 class="font-semibold text-blue-900 mb-2">💡 支付说明</h3>
      <ul class="text-sm text-blue-800 space-y-1">
        <li>• 扫码支付后，请填写上方表单提交订单</li>
        <li>• 管理员将在24小时内审核并解锁课程</li>
        <li>• 解锁后会短信通知您登录密码</li>
        <li>• 支持单本购买(¥9.9起)或全季通票(¥399)</li>
      </ul>
    </div>

    <!-- 订单列表 -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-lg font-bold text-primary mb-4">我的订单</h2>
      <div id="order-list" class="space-y-3">
        <p class="text-muted text-center py-8">暂无订单，请先扫码支付后提交订单</p>
      </div>
    </div>
  </main>

  <!-- 成功提示 -->
  <div id="success-modal" class="modal fixed inset-0 bg-black/50 items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <h3 class="text-xl font-bold text-primary mb-2">订单提交成功！</h3>
      <p class="text-muted mb-6">管理员将在24小时内审核，解锁后会短信通知您</p>
      <button onclick="closeModal()" class="w-full bg-accent text-primary font-semibold py-2 rounded-lg">
        返回首页
      </button>
    </div>
  </div>

  <script>
    // 提交订单
    async function submitOrder() {
      const phone = document.getElementById('phone').value.trim();
      const wechat = document.getElementById('wechat').value.trim();
      const courseId = document.getElementById('course-select').value;
      const note = document.getElementById('note').value.trim();

      if (!phone) {
        alert('请输入手机号码');
        return;
      }
      if (!/^\d{11}$/.test(phone)) {
        alert('请输入正确的11位手机号');
        return;
      }
      if (!courseId) {
        alert('请选择要购买的课程');
        return;
      }

      const order = {
        id: Date.now().toString(36),
        phone,
        wechat,
        courseId,
        note,
        status: 'pending',
        createdAt: new Date().toISOString()
      };

      const orders = JSON.parse(localStorage.getItem('rgx_orders') || '[]');
      orders.unshift(order);
      localStorage.setItem('rgx_orders', JSON.stringify(orders));

      document.getElementById('phone').value = '';
      document.getElementById('wechat').value = '';
      document.getElementById('course-select').value = '';
      document.getElementById('note').value = '';

      document.getElementById('success-modal').classList.add('active');
      loadOrders();
    }

    function closeModal() {
      document.getElementById('success-modal').classList.remove('active');
      window.location.href = './index.html';
    }

    function loadOrders() {
      const orders = JSON.parse(localStorage.getItem('rgx_orders') || '[]');
      const container = document.getElementById('order-list');

      if (orders.length === 0) {
        container.innerHTML = '<p class="text-muted text-center py-8">暂无订单，请先扫码支付后提交订单</p>';
        return;
      }

      const courseNames = { 'all': '全部33门课程', 'single': '单门课程' };
      const amounts = { 'all': 399, 'single': 9.9 };

      container.innerHTML = orders.map(o => `
        <div class="border border-gray-200 rounded-lg p-4">
          <div class="flex justify-between items-start">
            <div>
              <div class="font-medium text-primary">订单 #${o.id}</div>
              <div class="text-sm text-muted">${new Date(o.createdAt).toLocaleString('zh-CN')}</div>
              <div class="text-sm text-muted">手机: ${o.phone}</div>
              ${o.wechat ? `<div class="text-sm text-muted">微信: ${o.wechat}</div>` : ''}
            </div>
            <span class="px-2 py-1 text-xs font-medium ${o.status === 'pending' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'}">
              ${o.status === 'pending' ? '待审核' : '已解锁'}
            </span>
          </div>
          <div class="mt-2 text-sm text-gray-600">
            课程: ${courseNames[o.courseId] || o.courseId} | 金额: ¥${amounts[o.courseId] || 0}
          </div>
          ${o.note ? `<div class="text-sm text-gray-500 mt-1">备注: ${o.note}</div>` : ''}
        </div>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
