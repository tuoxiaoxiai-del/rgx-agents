<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>项目总海报 - 冲突型</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0a0a0a;
      font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 80px 60px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    
    /* 红色装饰线 */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: #c9a227;
    }
    
    /* 内容区 */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 1;
    }
    
    /* 主标题 */
    .main-title {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 30px;
      letter-spacing: 4px;
    }
    
    .main-title .highlight {
      color: #c9a227;
      display: block;
      margin-top: 10px;
    }
    
    /* 副标题 */
    .sub-title {
      font-size: 36px;
      color: #888;
      margin-bottom: 60px;
      line-height: 1.6;
    }
    
    /* 核心卖点 */
    .features {
      display: flex;
      gap: 40px;
      margin-bottom: 60px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    
    .feature-icon {
      width: 80px;
      height: 80px;
      background: rgba(201, 162, 39, 0.2);
      border: 2px solid #c9a227;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    
    .feature-text {
      font-size: 24px;
      color: #ccc;
    }
    
    /* 数据展示 */
    .stats {
      display: flex;
      gap: 60px;
      margin-bottom: 60px;
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-number {
      font-size: 56px;
      font-weight: 900;
      color: #c9a227;
      display: block;
    }
    
    .stat-label {
      font-size: 24px;
      color: #888;
      margin-top: 8px;
    }
    
    /* CTA */
    .cta {
      background: #c9a227;
      color: #0a0a0a;
      font-size: 32px;
      font-weight: 700;
      padding: 24px 60px;
      border-radius: 8px;
      margin-top: 40px;
    }
    
    /* 底部信息 */
    .footer {
      text-align: center;
      z-index: 1;
    }
    
    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .qr-box {
      width: 200px;
      height: 200px;
      background: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .qr-box img {
      width: 180px;
      height: 180px;
      object-fit: contain;
    }
    
    .qr-text {
      font-size: 24px;
      color: #888;
    }
    
    .brand {
      font-size: 28px;
      color: #666;
      margin-top: 20px;
    }
    
    .brand strong {
      color: #c9a227;
    }
    
    .tagline {
      font-size: 20px;
      color: #555;
      margin-top: 10px;
    }
    
    /* 装饰元素 */
    .deco-line {
      position: absolute;
      background: #c9a227;
      opacity: 0.1;
    }
    
    .deco-line-1 {
      width: 2px;
      height: 300px;
      left: 60px;
      top: 200px;
    }
    
    .deco-line-2 {
      width: 2px;
      height: 300px;
      right: 60px;
      top: 200px;
    }
  </style>
</head>
